# =====================================================
# jdotfiles — Jungus OG dotfiles for Hyprland
# v1 built 2026-10-16 by mogus: single-file config
# migrated from jdotfiles (~/dotfiles). Effective settings
# were audited from the live jdotfiles setup, including the
# jdotfiles Settings App overrides (border_size 4, blur off)
# that jdotfiles applied on top of its own config files.
# Rollback: bash ~/rollback-to-jdotfiles.sh
# =====================================================

$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/j/scripts

# -----------------------------------------------------
# Environment
# (union of jdotfiles jdotfiles.conf + nvidia.conf; where they
# conflicted, the later-loaded jdotfiles value won)
# -----------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = SDL_VIDEODRIVER,wayland
# NVIDIA
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1
env = MOZ_DISABLE_RDD_SANDBOX,1
env = EGL_PLATFORM,wayland

# -----------------------------------------------------
# Monitor (from nwg-displays output, 2026-09-06)
# -----------------------------------------------------
monitor = HDMI-A-1, 2560x1440@60, 0x0, 1.0, vrr, 0
monitor = HEADLESS-1, 1600x900@60, 0x0, 1
workspace = 1, monitor:HDMI-A-1, default:true

# -----------------------------------------------------
# Autostart
# jdotfiles script wrappers replaced with direct commands.
# Dropped: xdg.sh portal dance (uwsm handles portals),
# jdotfiles-autostart.sh, cleanup.sh, the Settings App's
# hyprctl.sh (its values are baked into this file).
# -----------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hyprctl setcursor Adwaita 24
exec-once = ~/.config/waybar/launch.sh
exec-once = ~/.config/hypr/scripts/headless-fallback.sh
exec-once = swaync
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = waypaper --restore
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita' && gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark' && gsettings set org.gnome.desktop.interface font-name 'Cantarell 11' && gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita' && gsettings set org.gnome.desktop.interface cursor-size 24 && gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# Q's apps
exec-once = [workspace 2 silent] kitty -e --hold btop
exec-once = [workspace 2 silent] kitty -e --hold neo
exec-once = [workspace 2 silent] kitty -e --hold cava
exec-once = [workspace 4 silent] firefox
# discord + steam: packages not currently installed; uncomment if reinstalled
# exec-once = [workspace 3 silent] discord
# exec-once = [workspace 5 silent] steam

# -----------------------------------------------------
# Input (was conf/keyboard.conf)
# -----------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    numlock_by_default = true
    mouse_refocus = false
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        scroll_factor = 1.0
    }
    sensitivity = 0
}

cursor {
    no_hardware_cursors = true
}

# -----------------------------------------------------
# General
# Effective jdotfiles merge: layouts/default.conf won over
# windows/default.conf (loaded later), resize_on_border
# came from windows/default.conf, border_size 4 is the
# Settings App override. Layout is MASTER.
# -----------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 4
    col.active_border = rgb(bbccdd)
    col.inactive_border = rgba(595959aa)
    layout = master
    resize_on_border = true
}

# -----------------------------------------------------
# Decoration (decorations/default.conf, with the
# Settings App override: blur is actually OFF)
# -----------------------------------------------------
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    blur {
        enabled = false
        size = 6
        passes = 4
        new_optimizations = on
        ignore_opacity = true
        xray = true
    }
    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = 0x66000000
    }
}

# -----------------------------------------------------
# Animations (animations-fast.conf)
# -----------------------------------------------------
animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, md3_decel, popin 60%
    animation = border, 1, 10, default
    animation = fade, 1, 2.5, md3_decel
    animation = workspaces, 1, 3.5, easeOutExpo, slide
    animation = specialWorkspace, 1, 3, md3_decel, slidevert
}

# -----------------------------------------------------
# Misc (conf/misc.conf)
# -----------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    initial_workspace_tracking = 1
}

# -----------------------------------------------------
# Window + layer rules
# (windowrules/default.conf + jdotfiles.conf + custom.conf)
# -----------------------------------------------------
windowrule = tile 1, match:title ^(Microsoft-edge)$
windowrule = tile 1, match:title ^(Brave-browser)$
windowrule = tile 1, match:title ^(Chromium)$
windowrule = float 1, match:title ^(pavucontrol)$
windowrule = float 1, match:title ^(blueman-manager)$
windowrule = float 1, match:title ^(nm-connection-editor)$
windowrule = float 1, match:title ^(qalculate-gtk)$
windowrule = float 1, match:title ^(Friends|Friends List)
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$
windowrule = opaque 1, match:title ^(Picture-in-Picture)$
windowrule = move 69.5% 4%, match:title ^(Picture-in-Picture)$
windowrule = float 1, match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = size 700 600, match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = center 1, match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = pin 1, match:class (.*org.pulseaudio.pavucontrol.*)
windowrule = float 1, match:title (ChatGPT.*)
windowrule = float 1, match:title (.*chat.openai.com.*)
windowrule = size 500 50%, match:title (.*chat.openai.com.*)
windowrule = move 20 70, match:title (.*chat.openai.com.*)
windowrule = float 1, match:class (.*waypaper.*)
windowrule = size 900 700, match:class (.*waypaper.*)
windowrule = center 1, match:class (.*waypaper.*)
windowrule = pin 1, match:class (.*waypaper.*)
windowrule = float 1, match:class (blueman-manager)
windowrule = size 800 600, match:class (blueman-manager)
windowrule = center 1, match:class (blueman-manager)
windowrule = float 1, match:class (nwg-look)
windowrule = size 700 600, match:class (nwg-look)
windowrule = move 10% 20%, match:class (nwg-look)
windowrule = pin 1, match:class (nwg-look)
windowrule = float 1, match:class (nwg-displays)
windowrule = size 900 600, match:class (nwg-displays)
windowrule = move 10% 20%, match:class (nwg-displays)
windowrule = pin 1, match:class (nwg-displays)
windowrule = float 1, match:class (io.missioncenter.MissionCenter)
windowrule = pin 1, match:class (io.missioncenter.MissionCenter)
windowrule = center 1, match:class (io.missioncenter.MissionCenter)
windowrule = size 900 600, match:class (io.missioncenter.MissionCenter)
windowrule = float 1, match:class (org.gnome.Calculator)
windowrule = size 700 600, match:class (org.gnome.Calculator)
windowrule = center 1, match:class (org.gnome.Calculator)
windowrule = float 1, match:class (it.mijorus.smile)
windowrule = pin 1, match:class (it.mijorus.smile)
windowrule = move 100%-w-40 90, match:class (it.mijorus.smile)
windowrule = float 1, match:class (dotfiles-floating)
windowrule = size 1000 700, match:class (dotfiles-floating)
windowrule = center 1, match:class (dotfiles-floating)
layerrule = blur 1, match:namespace swaync-control-center 1
layerrule = blur 1, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center 1
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = blur 1, match:class waybar

# -----------------------------------------------------
# Keybindings (harmonized set, 2026-10-16)
# jdotfiles settings shims replaced with direct apps.
# Split binds use master-layout dispatchers (layout is
# master, so dwindle's togglesplit/swapsplit don't
# exist here; orientation next/prev is the equivalent).
# -----------------------------------------------------
bind = $mainMod, grave, exec, kitty
bind = $mainMod, B, exec, firefox
bind = $mainMod, R, exec, nemo
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, T, workspaceopt, allfloat
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
binde = ALT, Tab, cyclenext
binde = ALT, Tab, bringactivetotop
bind = $mainMod, E, exec, pkill rofi || rofi -show drun
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod SHIFT, S, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod CTRL, Q, exec, $HYPRSCRIPTS/wlogout.sh
bind = $mainMod, L, exec, ~/.config/hypr/scripts/power.sh lock
bind = $mainMod SHIFT, W, exec, waypaper --random
bind = $mainMod CTRL, W, exec, waypaper
bind = $mainMod ALT, W, exec, $HYPRSCRIPTS/wallpaper-automation.sh
bind = $mainMod SHIFT, TAB, exec, $HYPRSCRIPTS/keybindings.sh
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod CTRL, B, exec, ~/.config/waybar/toggle.sh
bind = $mainMod SHIFT, R, exec, $HYPRSCRIPTS/loadconfig.sh
bind = $mainMod, V, exec, $HYPRSCRIPTS/cliphist.sh
bind = $mainMod CTRL, T, exec, ~/.config/waybar/themeswitcher.sh
bind = $mainMod, TAB, togglespecialworkspace, htop
bind = $mainMod, X, layoutmsg, orientationnext
bind = $mainMod SHIFT, X, layoutmsg, orientationprev
bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-mute @DEFAULT_SINK@ 0 && pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86Lock, exec, hyprlock
bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-

bind = $mainMod, G, exec, geany

windowrule = float 1, match:class ^(dev.jungus.volpopup)$
windowrule = pin 1, match:class ^(dev.jungus.volpopup)$
windowrule = move 1196 50, match:class ^(dev.jungus.volpopup)$
windowrule = border_size 0, match:class ^(dev.jungus.volpopup)$
windowrule = no_shadow 1, match:class ^(dev.jungus.volpopup)$
